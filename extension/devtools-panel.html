<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tossue DevTools</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell devtools-shell">
      <header class="app-header">
        <div>
          <p class="eyebrow">DevTools Mode</p>
          <h1>Diagnostics Bridge</h1>
        </div>
        <button id="attachDebugger">Attach Debugger</button>
      </header>
      <section class="card">
        <p class="status" id="devtoolsStatus">Debugger is not attached.</p>
        <ul class="list bullet" id="devtoolsEvents"></ul>
      </section>
    </main>
    <script type="module" src="devtools-panel.js"></script>
  </body>
  </html>
