name: Build Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Chrome Extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck:extension

      - name: Build extension
        run: npm run build:extension

      - name: Create extension zip
        run: |
          cd packages/extension/dist
          zip -r ../../../tossue-extension-${{ github.ref_name }}.zip .

      - name: Generate SHA256 checksum
        run: sha256sum tossue-extension-${{ github.ref_name }}.zip > tossue-extension-${{ github.ref_name }}.zip.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tossue-extension-${{ github.ref_name }}
          path: |
            tossue-extension-${{ github.ref_name }}.zip
            tossue-extension-${{ github.ref_name }}.zip.sha256

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            tossue-extension-${{ github.ref_name }}.zip
            tossue-extension-${{ github.ref_name }}.zip.sha256
